{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品追加</title>
    <link rel="stylesheet" href="{% static 'account/css/style.css' %}">
</head>
<body>
    <h1>商品追加</h1>
    <form method="post">
        {% csrf_token %}
        
 {# ===== エラーメッセージ表示 ===== #}
 {% if errors %}
     <div style="color:red; border:1px solid red; padding:10px; margin-bottom:15px;">
         <p><strong>入力内容に不備があります</strong></p>
         <ul>
             {% for error in errors %}
                 <li>{{ error }}</li>
             {% endfor %}
         </ul>
     </div>
 {% endif %}
 <div>
    <label for="item_id">商品ID:</label>
    <input type="number" name="item_id" id="item_id" value="{{ form_data.item_id|default:'' }}" required>
</div>
<div>
    <label for="name">商品名:</label>
    <input type="text" name="name" id="name" value="{{ form_data.name|default:'' }}" required>
</div>
<div>
    <label for="manufacturer">メーカー:</label>
    <input type="text" name="manufacturer" id="manufacturer" value="{{ form_data.manufacturer|default:'' }}" required>
</div>
<div>
    <label for="color">色:</label>
    <input type="text" name="color" id="color" value="{{ form_data.color|default:'' }}" required>
</div>
<div>
    <label for="price">価格:</label>
    <input type="number" name="price" id="price" value="{{ form_data.price|default:'' }}" required>
</div>
<div>
    <label for="stock">在庫:</label>
    <input type="number" name="stock" id="stock" value="{{ form_data.stock|default:'' }}" required>
</div>
<div>
    <label for="recommended">おすすめ:</label>
    <input type="checkbox" name="recommended" id="recommended" {% if form_data.recommended %}checked{% endif %}>
</div>
<div>
    <label for="category_id">カテゴリ:</label>
    <select name="category_id" id="category_id" required>
        <option value="">-- 選択してください --</option>
        {% for category in categories %}
            <option value="{{ category.category_id }}"
                {% if form_data.category_id == category.category_id|stringformat:"s" %}selected{% endif %}>
                {{ category.name }}
            </option>
        {% endfor %}
    </select>
</div>
<button type="submit">追加</button>
    </form>
<br>
<li><a href="/account/adminItems/">商品管理へ戻る</a></li>
<li><a href="/account/adminMain/">管理者メインページへ</a></li>

</body>
</html>
