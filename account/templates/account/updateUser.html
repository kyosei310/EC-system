{% load static %}
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
		<title>会員情報修正</title>
		<link rel='stylesheet' type='text/css' href='{% static "account/css/style.css" %}' />
	</head>
<body>
    <h3>会員情報</h3>
    <br />
	<form action="/account/updateUser/" method='POST'>
    {% csrf_token %}
        <table>
            {{ update_form.as_table }}
            <tr>
                <td colspan="2"><input type="submit" value="変更"></td>
            </tr>
        </table>
        {% if message %}
            <div>{{ message }}</div>
        {% endif %}
    </form>
    <li><a href="/account/withdrawConfirm/">退会する</a></li>
    <li><a href="/shopping/">商品検索へ</a></li>
</body>
</html>
